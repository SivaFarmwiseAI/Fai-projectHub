# Next.js SSR app — deployed at repo root (NO appRoot / monorepo settings).
# baseDirectory MUST be .next so Amplify publishes SSR compute resources, not a static S3 site.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*