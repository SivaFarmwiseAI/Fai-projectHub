version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
        - |
          if [ "$AWS_BRANCH" = "prod" ] || [ "$AWS_BRANCH" = "main" ]; then
            echo "API_URL=https://8ijt3g2824.execute-api.ap-south-1.amazonaws.com/prod" > .env.local
            echo "NEXT_PUBLIC_API_URL=https://8ijt3g2824.execute-api.ap-south-1.amazonaws.com/prod" >> .env.local
          else
            echo "API_URL=https://zp5zd210pe.execute-api.ap-south-1.amazonaws.com/dev" > .env.local
            echo "NEXT_PUBLIC_API_URL=https://zp5zd210pe.execute-api.ap-south-1.amazonaws.com/dev" >> .env.local
          fi
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
