AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ProjectHub – serverless REST API (public, no VPC)

# ── Parameters ────────────────────────────────────────────────────────────────

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment (used as API Gateway stage name)

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string (e.g. postgresql://user:pass@host:5432/projecthub)

  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret (256-bit hex string)

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Anthropic API key (sk-ant-...) — legacy, no longer used (AI runs on Gemini)

  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Google Gemini API key (AIza...)

  GeminiModel:
    Type: String
    Default: gemini-3.5-flash
    Description: Gemini model id for plan generation, document extraction and capture parsing

  CloudfrontURL:
    Type: String
    NoEcho: true
    Description: Cloud Front URL

  DocumentsBucketName:
    Type: String
    Description: Name of the existing S3 bucket used for project documents (created outside this stack)

  CorsOrigins:
    Type: String
    Default: https://projecthub.farmwiseai.com
    Description: Allowed CORS origin – the frontend URL (no trailing slash)

# ── Globals ───────────────────────────────────────────────────────────────────

Globals:
  Function:
    Runtime: python3.10
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    CodeUri: .
    Layers:
      - !Ref DepsLayer
    Environment:
      Variables:
        ENVIRONMENT: !Ref Env
        DATABASE_URL: !Ref DatabaseUrl
        JWT_SECRET: !Ref JwtSecret
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        ANTHROPIC_MODEL: claude-sonnet-4-6
        GEMINI_API_KEY: !Ref GeminiApiKey
        GEMINI_MODEL: !Ref GeminiModel
        JWT_ACCESS_EXPIRE_MINUTES: '480'
        DB_POOL_MIN: '1'
        DB_POOL_MAX: '5'
        CORS_ORIGINS: !Ref CorsOrigins
    Tags:
      Project: ProjectHub
      Environment: !Ref Env
      ManagedBy: SAM

# ── Resources ─────────────────────────────────────────────────────────────────

Resources:

  # ── Lambda Layer (shared Python dependencies) ───────────────────────────────

  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub projecthub-deps-${Env}
      Description: Shared Python dependencies for all ProjectHub Lambda functions
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.10
      CompatibleArchitectures:
        - x86_64
      RetentionPolicy: Retain
    # Metadata:
    #   # Built without Docker via layer/Makefile, which pulls Linux x86_64
    #   # (manylinux) wheels so compiled deps (cryptography, bcrypt,
    #   # pydantic-core) match the Lambda runtime. Requires GNU make on PATH.
    #   BuildMethod: makefile

  # ── Document Storage – S3 + CloudFront ─────────────────────────────────────
  #
  # Bucket name is derived from stack name + env so it's unique per deployment.
  # CloudFront serves files via HTTPS; Lambda uses a presigned PUT URL to let
  # the browser upload directly — the Lambda function never proxies file bytes.

  # DocumentsBucket:
  #   Type: AWS::S3::Bucket
  #   DeletionPolicy: Retain
  #   UpdateReplacePolicy: Retain
  #   Properties:
  #     BucketName: !Sub fai-projecthub-documents-${Env}-${AWS::AccountId}
  #     PublicAccessBlockConfiguration:
  #       BlockPublicAcls: true
  #       BlockPublicPolicy: true
  #       IgnorePublicAcls: true
  #       RestrictPublicBuckets: true
  #     CorsConfiguration:
  #       CorsRules:
  #         - AllowedHeaders: ["*"]
  #           AllowedMethods: [PUT]
  #           AllowedOrigins: [!Ref CorsOrigins, "http://localhost:3000"]
  #           ExposedHeaders: [ETag]
  #           MaxAge: 3600
  #     Tags:
  #       - Key: Project
  #         Value: ProjectHub
  #       - Key: Environment
  #         Value: !Ref Env
  
  
  # ── API Gateway – public REST API (no VPC) ──────────────────────────────────
  #
  # CORS is handled entirely by the Lambda handlers (see base.py make_handler).
  # ALL methods including OPTIONS are proxied to Lambda; do not set Cors here
  # or API Gateway will intercept OPTIONS before Lambda can respond.

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub fai-projecthub-api-${Env}
      StageName: !Ref Env
      TracingEnabled: true
      # API Gateway CloudWatch logging (AccessLogSetting + LoggingLevel) requires
      # an account-level IAM role ARN set via AWS::ApiGateway::Account. Disabled
      # here to keep deploys self-contained — Lambda execution logs still flow to
      # /aws/lambda/projecthub-*-${Env}. Re-enable once the account role is set.
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          ThrottlingRateLimit: 200
          ThrottlingBurstLimit: 400

  # ── CloudWatch Log Groups (explicit to control retention) ───────────────────
  # ApiAccessLogGroup removed alongside AccessLogSetting above. Re-add when the
  # API Gateway account-level CloudWatch role is configured.

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-health-${Env}
      RetentionInDays: 14

  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-auth-${Env}
      RetentionInDays: 30

  UsersLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-users-${Env}
      RetentionInDays: 30

  ProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-projects-${Env}
      RetentionInDays: 30

  TasksLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-tasks-${Env}
      RetentionInDays: 30

  PhasesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-phases-${Env}
      RetentionInDays: 30

  AnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-analytics-${Env}
      RetentionInDays: 30

  # AILogGroup intentionally omitted — pre-existing log group
  # /aws/lambda/projecthub-ai-${Env} from a prior deploy (DeletionPolicy: Retain)
  # blocks CFN from re-creating it. Lambda will reuse the existing group on first
  # invocation. Re-import the resource later if you need to manage RetentionInDays
  # via the stack.

  CaptureLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-capture-${Env}
      RetentionInDays: 30

  DiscussionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-discussions-${Env}
      RetentionInDays: 30

  ReviewsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-reviews-${Env}
      RetentionInDays: 30

  StandupLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-standup-${Env}
      RetentionInDays: 14

  SubmissionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-submissions-${Env}
      RetentionInDays: 30

  LeaveLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-leave-${Env}
      RetentionInDays: 30

  CommitmentsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-commitments-${Env}
      RetentionInDays: 30

  MeetingsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-meetings-${Env}
      RetentionInDays: 30

  ScheduleRequestsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-schedule-requests-${Env}
      RetentionInDays: 30

  PerformanceAssessmentsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/projecthub-performance-assessments-${Env}
      RetentionInDays: 30

  # ── Lambda Functions ────────────────────────────────────────────────────────
  #
  # Each function owns a single API domain. Routes within the domain are
  # dispatched by make_handler() inside the Lambda (regex routing in base.py).
  #
  # Two events per domain: base path (/api/x) + sub-paths (/api/x/{proxy+}).
  # Both needed because API GW {proxy+} requires at least one path segment.
  #
  # API Gateway max integration timeout is 29 s. Lambda timeouts >29 s are
  # useful for direct invocations and async patterns only.

  # ── Health ──────────────────────────────────────────────────────────────────

  HealthFunction:
    Type: AWS::Serverless::Function
    DependsOn: HealthLogGroup
    Properties:
      FunctionName: !Sub projecthub-health-${Env}
      Handler: src.handlers.health.handler
      Description: GET /health – lightweight liveness probe
      MemorySize: 128
      Timeout: 10
      Events:
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: python3.10

  # ── Auth ────────────────────────────────────────────────────────────────────

  AuthFunction:
    Type: AWS::Serverless::Function
    DependsOn: AuthLogGroup
    Properties:
      FunctionName: !Sub projecthub-auth-${Env}
      Handler: src.handlers.auth.handler
      Description: /api/auth – login, logout, me, register, change-password
      Events:
        AuthProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/auth/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Users ───────────────────────────────────────────────────────────────────

  UsersFunction:
    Type: AWS::Serverless::Function
    DependsOn: UsersLogGroup
    Properties:
      FunctionName: !Sub projecthub-users-${Env}
      Handler: src.handlers.users.handler
      Description: /api/users – CRUD, tasks, leave per user
      Events:
        UsersBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/users
            Method: ANY
        UsersProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/users/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Projects ────────────────────────────────────────────────────────────────

  ProjectsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProjectsLogGroup
    Properties:
      FunctionName: !Sub projecthub-projects-${Env}
      Handler: src.handlers.projects.handler
      Description: /api/projects – CRUD, kanban, timeline, search, updates, insights
      MemorySize: 768
      Environment:
        Variables:
          S3_BUCKET: !Ref DocumentsBucketName
          S3_REGION: !Sub "${AWS::Region}"
          CLOUDFRONT_DOMAIN: !Ref CloudfrontURL
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:CreateMultipartUpload
                - s3:UploadPart
                - s3:CompleteMultipartUpload
                - s3:AbortMultipartUpload
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${DocumentsBucketName}/*"
            # If the documents bucket is encrypted with a customer-managed KMS
            # key, PutObject also needs these on that key — otherwise S3 returns
            # AccessDenied. Replace the key ARN with the one from
            # `aws s3api get-bucket-encryption --bucket <bucket>` and redeploy.
            # The KMS *key policy* must also grant this role.
            # - Effect: Allow
            #   Action:
            #     - kms:GenerateDataKey
            #     - kms:Encrypt
            #     - kms:Decrypt
            #   Resource:
            #     - arn:aws:kms:ap-south-1:448658736283:key/REPLACE-WITH-KEY-ID
      Events:
        ProjectsBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/projects
            Method: ANY
        ProjectsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/projects/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Tasks ───────────────────────────────────────────────────────────────────

  TasksFunction:
    Type: AWS::Serverless::Function
    DependsOn: TasksLogGroup
    Properties:
      FunctionName: !Sub projecthub-tasks-${Env}
      Handler: src.handlers.tasks.handler
      Description: /api/tasks – CRUD, steps, milestones, deadline extensions
      Events:
        TasksBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/tasks
            Method: ANY
        TasksProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/tasks/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Phases ──────────────────────────────────────────────────────────────────

  PhasesFunction:
    Type: AWS::Serverless::Function
    DependsOn: PhasesLogGroup
    Properties:
      FunctionName: !Sub projecthub-phases-${Env}
      Handler: src.handlers.phases.handler
      Description: /api/phases – CRUD, sign-offs, attachments
      Events:
        PhasesBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/phases
            Method: ANY
        PhasesProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/phases/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Analytics ───────────────────────────────────────────────────────────────

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    DependsOn: AnalyticsLogGroup
    Properties:
      FunctionName: !Sub projecthub-analytics-${Env}
      Handler: src.handlers.analytics.handler
      Description: /api/analytics – dashboard, team-health, velocity, workload, notifications
      MemorySize: 512
      Events:
        AnalyticsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/analytics/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── AI ──────────────────────────────────────────────────────────────────────
  #
  # Lambda timeout 90 s for direct / async invocations.
  # API Gateway integration timeout is hard-capped at 29 s; synchronous calls
  # via the API will receive 504 if Claude takes longer than 29 s.

  AIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub projecthub-ai-${Env}
      Handler: src.handlers.ai.handler
      Description: /api/ai – plan generation, stack suggestion, review, insights
      Timeout: 90
      Events:
        AIProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/ai/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Capture ─────────────────────────────────────────────────────────────────

  CaptureFunction:
    Type: AWS::Serverless::Function
    DependsOn: CaptureLogGroup
    Properties:
      FunctionName: !Sub projecthub-capture-${Env}
      Handler: src.handlers.capture.handler
      Description: /api/capture – session parsing with Claude AI (asyncio.run)
      Timeout: 90
      MemorySize: 512
      Events:
        CaptureBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/capture
            Method: ANY
        CaptureProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/capture/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Discussions ─────────────────────────────────────────────────────────────

  DiscussionsFunction:
    Type: AWS::Serverless::Function
    DependsOn: DiscussionsLogGroup
    Properties:
      FunctionName: !Sub projecthub-discussions-${Env}
      Handler: src.handlers.discussions.handler
      Description: /api/discussions – threaded discussion boards
      Events:
        DiscussionsBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/discussions
            Method: ANY
        DiscussionsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/discussions/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Reviews ─────────────────────────────────────────────────────────────────

  ReviewsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ReviewsLogGroup
    Properties:
      FunctionName: !Sub projecthub-reviews-${Env}
      Handler: src.handlers.reviews.handler
      Description: /api/reviews – code and submission review workflows
      Events:
        ReviewsBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/reviews
            Method: ANY
        ReviewsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/reviews/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Standup ─────────────────────────────────────────────────────────────────

  StandupFunction:
    Type: AWS::Serverless::Function
    DependsOn: StandupLogGroup
    Properties:
      FunctionName: !Sub projecthub-standup-${Env}
      Handler: src.handlers.standup.handler
      Description: /api/standup – daily standup entries and 90-day history
      MemorySize: 256
      Events:
        StandupBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/standup
            Method: ANY
        StandupProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/standup/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Submissions ─────────────────────────────────────────────────────────────
  #
  # Also owns /api/feedback and /api/checkpoints (defined in submissions.py).

  SubmissionsFunction:
    Type: AWS::Serverless::Function
    DependsOn: SubmissionsLogGroup
    Properties:
      FunctionName: !Sub projecthub-submissions-${Env}
      Handler: src.handlers.submissions.handler
      Description: /api/submissions + /api/feedback + /api/checkpoints
      Events:
        SubmissionsBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/submissions
            Method: ANY
        SubmissionsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/submissions/{proxy+}
            Method: ANY
        FeedbackCreate:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/feedback
            Method: ANY
        CheckpointsCreate:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/checkpoints
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Leave ───────────────────────────────────────────────────────────────────

  LeaveFunction:
    Type: AWS::Serverless::Function
    DependsOn: LeaveLogGroup
    Properties:
      FunctionName: !Sub projecthub-leave-${Env}
      Handler: src.handlers.leave.handler
      Description: /api/leave – requests, approval, team availability calendar
      Events:
        LeaveBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/leave
            Method: ANY
        LeaveProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/leave/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Commitments ─────────────────────────────────────────────────────────────

  CommitmentsFunction:
    Type: AWS::Serverless::Function
    DependsOn: CommitmentsLogGroup
    Properties:
      FunctionName: !Sub projecthub-commitments-${Env}
      Handler: src.handlers.commitments.handler
      Description: /api/commitments – team commitments with from/to date windows
      Events:
        CommitmentsBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/commitments
            Method: ANY
        CommitmentsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/commitments/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Meetings ────────────────────────────────────────────────────────────────

  MeetingsFunction:
    Type: AWS::Serverless::Function
    DependsOn: MeetingsLogGroup
    Properties:
      FunctionName: !Sub projecthub-meetings-${Env}
      Handler: src.handlers.meetings.handler
      Description: /api/meetings – first-class meetings (project or general)
      Events:
        MeetingsBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/meetings
            Method: ANY
        MeetingsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/meetings/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Schedule Requests (CEO inbox) ───────────────────────────────────────────

  ScheduleRequestsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ScheduleRequestsLogGroup
    Properties:
      FunctionName: !Sub projecthub-schedule-requests-${Env}
      Handler: src.handlers.schedule_requests.handler
      Description: /api/schedule-requests – CEO accept/reschedule/reject queue
      Events:
        ScheduleRequestsBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/schedule-requests
            Method: ANY
        ScheduleRequestsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/schedule-requests/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

  # ── Performance Assessments ─────────────────────────────────────────────────

  PerformanceAssessmentsFunction:
    Type: AWS::Serverless::Function
    DependsOn: PerformanceAssessmentsLogGroup
    Properties:
      FunctionName: !Sub projecthub-performance-assessments-${Env}
      Handler: src.handlers.performance_assessments.handler
      Description: /api/performance-assessments – assessment submissions + leadership analysis
      MemorySize: 256
      Events:
        PerformanceAssessmentsBase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/performance-assessments
            Method: ANY
        PerformanceAssessmentsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/performance-assessments/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10

# ── Outputs ───────────────────────────────────────────────────────────────────

Outputs:
  ApiUrl:
    Description: Public API base URL (set NEXT_PUBLIC_API_URL to this value)
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Env}
    Export:
      Name: !Sub fai-ProjectHub-ApiUrl-${Env}

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref Api
    Export:
      Name: !Sub ProjectHub-ApiId-${Env}

  DepsLayerArn:
    Description: Lambda Layer ARN for shared Python dependencies
    Value: !Ref DepsLayer
    Export:
      Name: !Sub ProjectHub-DepsLayerArn-${Env}

  
