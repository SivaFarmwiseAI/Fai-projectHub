# ── ProjectHub SAM CLI Configuration ──────────────────────────────────────────
#
# Usage:
#   sam build                          # build all functions + layer
#   sam deploy                         # deploy to production
#   sam deploy --config-env staging    # deploy to staging
#   sam deploy --guided                # first-time interactive setup
#
# Before first deploy:
#   Create an S3 bucket for SAM artifacts:
#     aws s3 mb s3://YOUR-SAM-ARTIFACTS-BUCKET --region ap-south-1
#   Then replace YOUR-SAM-ARTIFACTS-BUCKET below.

version = 0.1

# ── Shared build settings (all environments) ──────────────────────────────────

[default.global.parameters]
stack_name = "projecthub-api"

[default.build.parameters]
# use_container builds inside Amazon Linux so binary wheels (bcrypt, cryptography,
# pydantic_core) match the Lambda runtime. Required: there is no local python3.10.
use_container = true
parallel      = true
cached        = true
# NOTE: do NOT set build_dir here. `sam build` honours it but plain `sam deploy`
# reads the default .aws-sam/build — a mismatch deploys a stale/broken package.
# Leaving it unset keeps build + deploy pointed at the same .aws-sam/build.

# ── Production ────────────────────────────────────────────────────────────────

[default.deploy.parameters]
stack_name        = "fai-projecthub-backend-dev"
s3_bucket         = "fai-projecthub-dev"
s3_prefix         = "projecthub/api"
region            = "ap-south-1"
profile           = "AWSAdministratorAccess-237557377577"
confirm_changeset = true
capabilities      = "CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
fail_on_empty_changeset = false
parameter_overrides = [
  "Env=dev",
  "CorsOrigins=*",
  # Documents are served by the only CloudFront distribution in 237557377577
  # (E1KNVRXAOT3YP9), whose origin is the fai-projecthub-dev bucket.
  "CloudfrontURL=d24mw8eeujakzf.cloudfront.net",
  "DocumentsBucketName=fai-projecthub-dev",
  "DatabaseUrl=postgresql://postgres:dRcO%3AyJb2l%24gxa8i%296%3C9L21U%23%3CES@fai-apps-pg-db.cte4msus2vhc.ap-south-1.rds.amazonaws.com:5432/ProjectHub",
  "JwtSecret=7b9c3e9f6a1d4c1a5d8f0c4b7a2e9d3c5f8b1a6c9d2e4f7a8b0c1d3e5f6a7b9",
  "GeminiApiKey=AIzaSyCgUdQc3d4ZYwn_IK__xTE9vjOU5BYqPyE",
